# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name yourplatform.com www.yourplatform.com api.yourplatform.com *.yourplatform.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Shared SSL settings (included in each HTTPS block) ────────────────────────
# Define common TLS and security header settings as a map so they're DRY.
# Nginx doesn't support "include" inside server blocks, so we repeat the minimal
# set. A separate /etc/nginx/snippets/ssl.conf can be used if preferred.

# ── Frontend (Next.js — yourplatform.com) ─────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name yourplatform.com www.yourplatform.com;

    ssl_certificate     /etc/letsencrypt/live/yourplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourplatform.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────────────
    # NOTE: CSP is intentionally set in next.config.ts (Next.js handles it per-route).
    # We set the structural headers here as a defence-in-depth layer.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             DENY                                            always;
    add_header X-Content-Type-Options      nosniff                                         always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy          "camera=(), microphone=(), geolocation=(self)"  always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json application/javascript
                    application/rss+xml application/atom+xml image/svg+xml;

    # ── Next.js immutable static assets ──────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://web:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── All other Next.js routes ──────────────────────────────────────────────
    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }
}

# ── API (.NET — api.yourplatform.com) ─────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name api.yourplatform.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourplatform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourplatform.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers for API responses
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff                                         always;
    add_header X-Frame-Options           DENY                                            always;
    add_header Referrer-Policy           "no-referrer"                                   always;

    # ── Upload size limit: must match Kestrel FormOptions (6 MB + overhead) ──
    client_max_body_size 7m;

    # ── SignalR WebSocket (long-lived connections) ────────────────────────────
    location /hubs/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Stripe webhook — no buffering, raw body must reach the controller ─────
    location /api/payments/webhook {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Disable buffering so the raw body bytes reach Stripe signature verifier intact
        proxy_request_buffering off;
        proxy_read_timeout      30s;
    }

    # ── Health endpoints — allow without auth for load balancer probes ────────
    location ~ ^/health(/ready)?$ {
        proxy_pass       http://api:5000;
        proxy_set_header Host $host;
        access_log       off;
    }

    # ── All other API routes ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout 10s;
    }
}

# ── Wildcard subdomain E-Store pages (*.yourplatform.com) ─────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name ~^(?<store_slug>[^.]+)\.yourplatform\.com$;

    ssl_certificate     /etc/letsencrypt/live/yourplatform.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourplatform.com-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;

    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade             $http_upgrade;
        proxy_set_header   Connection          "upgrade";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_set_header   X-Forwarded-Host    $host;
        proxy_set_header   X-Store-Slug        $store_slug;
        proxy_cache_bypass $http_upgrade;
    }
}
